[project]
name = "unicode-fonts"
version = "0.1.0"
description = "Format plain text with Unicode for platforms that have no rich text"
readme = "README.md"
authors = [
    { name = "Ben Allen", email = "ben05allen@hotmail.com" }
]
requires-python = ">=3.15"
dependencies = []
keywords = ["unicode", "markdown", "social-media", "text-formatting"]
classifiers = [
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.scripts]
unicode-fonts = "unicode_fonts.cli:main"

[project.optional-dependencies]
clipboard = ["pyperclip>=1.9"]

[dependency-groups]
dev = [
    "complexipy>=8.3.0",
    "prek>=0.5.10",
    "pyperclip>=1.11.0",
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.97",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py315"
extend-exclude = [
    "src/unicode_fonts/fonts.py",  # generated glyph tables, not hand-written code
    "README.md",  # the aligned comment blocks in its examples are deliberate
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Ambiguous homoglyphs are this project's entire subject matter, so the rules
# that warn about them in string literals and comments are counterproductive.
ignore = ["RUF001", "RUF002", "RUF003"]
